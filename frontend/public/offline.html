<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         background: #030712; color: #f9fafb; padding: 24px; box-sizing: border-box;
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .card { max-width: 340px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #9ca3af; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px;
           font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Check your internet connection, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
